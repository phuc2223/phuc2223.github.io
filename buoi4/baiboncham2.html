<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            .<div
                class="container"
            >
            <h3>a tạo nav tab cơ bản</h3>
                <nav
                    class="nav justify-content-center  "
                >
                    <a class="nav-link active" href="#" aria-current="page"
                        >Active link</a
                    >
                    <a class="nav-link" href="#">Link</a>
                    <a class="nav-link disabled" href="#">Disabled link</a>
                </nav>
                
            <h3>b tạo nav pill cơ bản</h3>
            <nav
                class="nav nav-pills  "
            >
                <a class="nav-link active" href="#" aria-current="page"
                    >Active link</a
                >
                <a class="nav-link" href="#">Link</a>
                <a class="nav-link disabled" href="#">Disabled link</a>
            </nav>
            

            <h3>c tạo xếp chồng theo chiều rọc</h3>
            <nav
                class="nav nav-tabs flex-column"
            >
                <a class="nav-link active" href="#" aria-current="page"
                    >Active link</a
                >
                <a class="nav-link" href="#">Link</a>
                <a class="nav-link disabled" href="#">Disabled link</a>
            </nav>

            <h3>d, sử dụng class .nav-justified canh đều Nav</h3>
            <div class="nav-justified">
                <nav
                    class="nav justify-content-center  "
                >
                    <a class="nav-link active" href="#" aria-current="page" background="primary"
                        >Active link</a
                    >
                    <a class="nav-link" href="#">Link</a>
                    <a class="nav-link disabled" href="#">Disabled link</a>
                </nav>
                
            </div>
            </div>
            
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
