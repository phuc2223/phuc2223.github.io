<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2.5: Tạo màu nền theo ngữ cảnh</title>
  <!-- Thư viện Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h2>Màu nền theo ngữ cảnh</h2>
    
    <!-- Các thẻ p thể hiện từng màu nền theo bài tập -->
    <p class="bg-primary text-white p-2">Văn bản quan trọng.</p>

    <p class="bg-success text-white p-2">Văn bản chỉ ra sự thành công.</p>

    <p class="bg-info text-white p-2">Văn bản chứa thông tin.</p>

    <p class="bg-warning text-dark p-2">Văn bản này là cảnh báo.</p>

    <p class="bg-danger text-white p-2">Văn bản thông báo sự nguy hiểm.</p>

    <p class="bg-secondary text-white p-2">Màu nền phụ.</p>

    <p class="bg-dark text-white p-2">Màu nền xám đen.</p>

    <p class="bg-light text-dark p-2 border">Màu nền xám trắng.</p>
  </div>

</body>
</html>
