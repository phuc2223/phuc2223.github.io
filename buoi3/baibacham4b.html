<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3.4b - Textarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <div class="container" style="max-width: 500px;">
        <h5 class="mb-2">Textarea</h5>
        <p class="text-muted">Dùng class <code>.form-control</code> để tạo kiểu cho vùng nhập văn bản</p>
        
        <div class="mb-3">
            <label for="binhLuan" class="form-label">Bình luận:</label>
            <textarea class="form-control" id="binhLuan" rows="4"></textarea>
        </div>
        
        <button type="submit" class="btn btn-secondary">Gửi</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
