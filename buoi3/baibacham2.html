<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Chương 3 - Bài 3.2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="p-4">

    <div class="container text-center" style="max-width: 900px;">
        <h3 class="mb-4">BÀI TẬP CHƯƠNG 3 - BÀI 3.2</h3>

        <!-- a) Tạo button group cơ bản -->
        <div class="mb-4 text-center">
            <h5 class="mb-3 text-start">a) Tạo button group cơ bản</h5>
            <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                <div class="btn-group" role="group" aria-label="Basic example">
                    <button type="button" class="btn btn-secondary text-nowrap">Home</button>
                    <button type="button" class="btn btn-secondary text-nowrap">About</button>
                    <button type="button" class="btn btn-secondary text-nowrap">Services</button>
                </div>
            </div>
        </div>

        <!-- b) Button group kèm icon -->
        <div class="mb-4 text-center">
            <h5 class="mb-3 text-start">b) Button group kèm icon</h5>
            <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                <div class="btn-group" role="group" aria-label="Button group with icons">
                    <button type="button" class="btn btn-secondary text-nowrap"><i class="fa-regular fa-eye me-1"></i> View</button>
                    <button type="button" class="btn bg-white text-dark border shadow-none text-decoration-none text-nowrap"><i class="fa-solid fa-pen-to-square me-1"></i> Edit</button>
                    <button type="button" class="btn btn-secondary text-nowrap"><i class="fa-solid fa-trash me-1"></i> Delete</button>
                </div>
            </div>
        </div>

        <!-- c) Button toolbar định dạng -->
        <div class="mb-4 text-center">
            <h5 class="mb-3 text-start">c) Button toolbar định dạng</h5>
            <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                <div class="btn-toolbar justify-content-center" role="toolbar" aria-label="Toolbar with button groups">
                    <div class="btn-group me-2" role="group">
                        <button type="button" class="btn btn-secondary">T</button>
                    </div>
                    <div class="btn-group me-2" role="group">
                        <button type="button" class="btn btn-secondary"><b>B</b></button>
                        <button type="button" class="btn btn-secondary"><i>I</i></button>
                        <button type="button" class="btn btn-secondary"><u>U</u></button>
                    </div>
                    <div class="btn-group me-2" role="group">
                        <button type="button" class="btn btn-secondary"><i class="fa-solid fa-align-left"></i></button>
                        <button type="button" class="btn btn-secondary"><i class="fa-solid fa-align-center"></i></button>
                        <button type="button" class="btn btn-secondary"><i class="fa-solid fa-align-right"></i></button>
                        <button type="button" class="btn btn-secondary"><i class="fa-solid fa-align-justify"></i></button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-secondary">&lt;&gt;</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
