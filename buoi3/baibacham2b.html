<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="p-4">

    <div class="container text-center" style="max-width: 800px;">
        <div class="mb-4 text-center">
            <h5 class="mb-3 text-start">b) Button group kèm icon</h5>
            <div class="d-flex flex-nowrap justify-content-center align-items-center gap-2 overflow-auto py-2">
                <div class="btn-group" role="group" aria-label="Button group with icons">
                    <button type="button" class="btn btn-secondary text-nowrap"><i class="fa-regular fa-eye me-1"></i> View</button>
                    <button type="button" class="btn bg-white text-dark border shadow-none text-decoration-none text-nowrap"><i class="fa-solid fa-pen-to-square me-1"></i> Edit</button>
                    <button type="button" class="btn btn-secondary text-nowrap"><i class="fa-solid fa-trash me-1"></i> Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
