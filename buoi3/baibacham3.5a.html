<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3.5a - Xác thực biểu mẫu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <div class="container" style="max-width: 600px;">
        <form>
            <div class="mb-3">
                <label for="validationCustom01" class="form-label">Tên người dùng:</label>
                <input type="text" class="form-control" id="validationCustom01" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <label for="validationCustom02" class="form-label">Mật khẩu:</label>
                <input type="password" class="form-control" id="validationCustom02" placeholder="Enter password" required>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">Đồng ý</label>
            </div>

            <button class="btn btn-secondary" type="submit">Đăng nhập</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
