<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2.9b: Card có Header và Footer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h2>b) Tạo Card có Header và Footer</h2>

    <div class="card text-center" style="max-width: 35rem;">
      <div class="card-header text-muted">
        Featured
      </div>
      <div class="card-body">
        <h4 class="card-title fw-bold">NASA Launched Solar Probe</h4>
        <p class="card-text text-secondary mt-3">
          NASA launched Parker space probe in 2018 with the mission of making observations of the outer corona of the Sun. It is the first-ever mission to "touch" the Sun.
        </p>
        <a href="#" class="btn btn-primary mt-2">Know more</a>
      </div>
      <div class="card-footer text-muted">
        3 years ago
      </div>
    </div>
  </div>

</body>
</html>
