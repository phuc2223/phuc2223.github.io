<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2.8: Tạo màu sắc link theo ngữ cảnh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h2>Màu sắc link theo ngữ cảnh</h2>
    <p class="text-secondary">Di chuột qua link để xem sự thay đổi màu sắc.</p>

    <p>
      <a href="#" class="link-secondary me-2">Link bị muted.</a>
      <a href="#" class="link-primary me-2">Link chính.</a>
      <a href="#" class="link-success me-2">Link thành công.</a>
      <a href="#" class="link-info me-2">Link thông tin.</a>
      <a href="#" class="link-warning me-2">Link cảnh báo.</a>
      <a href="#" class="link-danger me-2">Link nguy hiểm.</a>
      <a href="#" class="link-secondary me-2">Link phụ.</a>
      <a href="#" class="link-dark me-2">Link màu xám đen.</a>
      <a href="#" class="link-body-emphasis me-2">Link màu body/đen.</a>
    </p>
  </div>

</body>
</html>
