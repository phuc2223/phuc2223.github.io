<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2.9a: Card có tiêu đề và liên kết</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h2>a) Tạo card có tiêu đề và liên kết</h2>

    <div class="card" style="width: 22rem;">
      <div class="card-body">
        <h4 class="card-title">Eiffel Tower</h4>
        <h6 class="card-subtitle mb-3 text-muted">Champ de Mars, Paris, France</h6>
        <p class="card-text">
          Built in 1889 Eiffel Tower is one of the most iconic landmarks in the world.
        </p>
        <a href="#" class="card-link">View pictures</a>
        <a href="#" class="card-link">Learn more</a>
      </div>
    </div>
  </div>

</body>
</html>
