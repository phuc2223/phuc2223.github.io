<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2.7: Tạo độ mờ cho màu chữ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h2>Ví dụ: Sử dụng độ mờ cho màu chữ</h2>
    <p class="text-secondary">
      Trong thiết kế web, có thể áp dụng độ mờ 50% cho chữ màu đen hoặc trắng bằng cách sử dụng class <code>.text-black-50</code> hoặc <code>.text-white-50</code> của Bootstrap:
    </p>

    <!-- Chữ đen độ mờ 50% trên nền trắng -->
    <p class="text-black-50 p-2 border rounded">
     ví dụ: chữ màu đen với đô mờ 50% trên nền trắng.
    </p>
    <!-- Chữ trắng độ mờ 50% trên nền đen -->
    <p class="text-white-50 p-2 bg-dark rounded">
      ví dụ: chữ màu trắng với độ mờ 50% trên nền đen.      
    </p>  
  </div>

</body>
</html>
